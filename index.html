<script>
  document.addEventListener("DOMContentLoaded", () => {
    const viewport = document.querySelector("[data-fx-viewport]");
    const workWrap = document.querySelector(".work-wrap");
    const loop = document.querySelector("[data-fx-loop]");
    const template = document.querySelector("[data-fx-work-list]");
    if (!viewport || !workWrap || !loop || !template) return;

    /* ========= 1) 複製成 3 份 ========= */
    const mid = template.cloneNode(true);
    const bot = template.cloneNode(true);
    mid.removeAttribute("data-fx-work-list");
    bot.removeAttribute("data-fx-work-list");
    loop.appendChild(mid);
    loop.appendChild(bot);

    /* ========= 2) 無限輪迴（靠 scrollTop，但 scrollTop 由我們手動推動） ========= */
    let oneListHeight = 0;

    // ── layout 快取：scroll 路徑上零 DOM 讀取 ──
    let _scrollY = 0;   // 鏡像 viewport.scrollTop
    let _clientH = 0;   // 鏡像 viewport.clientHeight（只在 resize/measure 更新）
    let _scrollH = 0;   // 鏡像 viewport.scrollHeight（只在 measure 及 transition 後更新）
    let _scrollHTimer = null;

    const syncDimensions = () => {
      _clientH = viewport.clientHeight;
      _scrollH = viewport.scrollHeight;
    };

    const measure = () => {
      syncDimensions();
      oneListHeight = template.offsetHeight;
      if (_isMobile) {
        // item 0 of copy2 置於 60dvh
        const firstItem = items[itemsPerCopy];
        const itemH = firstItem.offsetHeight;
        _scrollY = oneListHeight + itemH / 2 - _clientH * 0.6;
      } else {
        _scrollY = oneListHeight;
      }
      viewport.scrollTop = _scrollY;
    };

    const fixLoop = () => {
      if (!oneListHeight || !_scrollH) return;
      const oneThird = _scrollH / 3;
      let y = _scrollY;                      // 不讀 DOM
      const max = _scrollH - _clientH;
      const upper = oneThird * 0.5;
      const lower = max - oneThird * 0.5;
      while (y < upper) y += oneThird;
      while (y > lower) y -= oneThird;
      if (y !== _scrollY) {
        _scrollY = y;
        viewport.scrollTop = y;              // 只寫，不讀
      }
      scheduleMobileCenter();
    };

    let _mcRafId = null;
    const scheduleMobileCenter = () => {
      if (_mcRafId) return; // 這幀已排程，跳過
      _mcRafId = requestAnimationFrame(() => {
        _mcRafId = null;
        if (typeof updateMobileCenter === "function") updateMobileCenter();
      });
    };

    requestAnimationFrame(() => {
      measure();
      // 立刻修一次，避免初始狀態不在安全區
      fixLoop();
    });

    let _resizeTimer = null;
    window.addEventListener("resize", () => {
      clearTimeout(_resizeTimer);
      _resizeTimer = setTimeout(() => {
        _isMobile = window.innerWidth <= 767;
        measure();
        fixLoop();
      }, 100);
    });

    /* ========= 3) ✅ 接管 wheel：保證任何裝置滾輪/觸控板都有反應 ========= */
    workWrap.addEventListener("wheel", (e) => {
      e.preventDefault();
      _scrollY += e.deltaY;
      viewport.scrollTop = _scrollY;
      fixLoop();
    }, { passive: false });

    /* ========= 4) ✅ 接管拖曳：手機手指/桌機滑鼠都能拖著滑 ========= */
    let pressed = false;
    let dragging = false;
    let startY = 0;
    let lastY = 0;
    let _pendingDy = 0;
    let _rafMoveId = null;
    const DRAG_THRESHOLD = 5;

    workWrap.addEventListener("pointerdown", (e) => {
      pressed = true;
      dragging = false;
      startY = e.clientY;
      lastY = e.clientY;
    });

    workWrap.addEventListener("pointermove", (e) => {
      if (!pressed) return;

      const totalDy = Math.abs(e.clientY - startY);
      if (!dragging && totalDy > DRAG_THRESHOLD) {
        dragging = true;
        viewport.setPointerCapture?.(e.pointerId);
      }
      if (!dragging) return;

      _pendingDy += e.clientY - lastY;
      lastY = e.clientY;

      if (_rafMoveId) return;
      _rafMoveId = requestAnimationFrame(() => {
        _rafMoveId = null;
        _scrollY -= _pendingDy;
        _pendingDy = 0;
        viewport.scrollTop = _scrollY;
        fixLoop();
      });
    });

    const endDrag = (e) => {
      if (dragging) viewport.releasePointerCapture?.(e.pointerId);
      pressed = false;
      dragging = false;
      _pendingDy = 0;
    };

    workWrap.addEventListener("pointerup", endDrag);
    workWrap.addEventListener("pointercancel", endDrag);
    workWrap.addEventListener("pointerleave", () => { pressed = false; dragging = false; _pendingDy = 0; });

    /* ========= 5) Hover 鄰居（跨段） ========= */
    const items = Array.from(loop.querySelectorAll(".fx-work-item"));
    const n = items.length;
    const titleEl = document.querySelector(".work-item_title");
    const subtitleEl = document.querySelector(".work-item_subtitle");
    const cursorEl = document.querySelector(".work-item_cursor");
    const cursorOutsideEl = document.querySelector(".cursor-outside");

    let _isMobile = window.innerWidth <= 767;
    const isMobile = () => _isMobile;

    if (cursorEl) cursorEl.style.opacity = _isMobile ? "1" : "0";

    const clearAll = () => {
      items.forEach(el => el.classList.remove("is-hover", "is-neighbor", "is-neighbor-2"));
    };

    const itemsPerCopy = n / 3; // 單份 list 的 item 數量

    // 手機各狀態的 item 高度（對應 CSS）
    const MOBILE_H = [120, 110, 100, 90]; // hover / neighbor / neighbor-2 / default

    const getItemH = (localIdx, centerLocalIdx) => {
      if (centerLocalIdx < 0) return 90;
      const fwd = ((localIdx - centerLocalIdx) % itemsPerCopy + itemsPerCopy) % itemsPerCopy;
      const bwd = ((centerLocalIdx - localIdx) % itemsPerCopy + itemsPerCopy) % itemsPerCopy;
      return MOBILE_H[Math.min(Math.min(fwd, bwd), 3)];
    };

    // 對三份 copy 同步套用 hover 狀態，避免 fixLoop 跳到另一份時閃爍
    const applyToAllCopies = (localIdx, classes) => {
      for (let copy = 0; copy < 3; copy++) {
        const base = copy * itemsPerCopy;
        classes.forEach(({ offset, cls }) => {
          const idx = ((localIdx + offset) % itemsPerCopy + itemsPerCopy) % itemsPerCopy;
          items[base + idx].classList.add(cls);
        });
      }
    };

    const applyHover = i => {
      if (activeFilter) return;
      clearAll();
      const localIdx = i % itemsPerCopy;
      applyToAllCopies(localIdx, [
        { offset: 0, cls: "is-hover" },
        { offset: -1, cls: "is-neighbor" },
        { offset: 1, cls: "is-neighbor" },
      ]);
    };

    // 手機：找出視覺中心最近的 item 套 is-hover
    let lastCenterLocalIdx = -1;

    const updateMobileCenter = () => {
      if (!isMobile() || !_scrollH) return;

      // ── 從快取變數計算，零 DOM 讀取 ──
      const oneThird = _scrollH / 3;
      const target = (_scrollY + _clientH * 0.6) % oneThird;

      let closestIdx = 0;
      let closestDist = Infinity;
      let cumY = 0;
      for (let i = 0; i < itemsPerCopy; i++) {
        const h = getItemH(i, lastCenterLocalIdx);
        const dist = Math.abs(cumY + h / 2 - target);
        if (dist < closestDist) { closestDist = dist; closestIdx = i; }
        cumY += h;
      }

      if (closestIdx === lastCenterLocalIdx) return;
      lastCenterLocalIdx = closestIdx;

      // transition 結束後更新 _scrollH（300ms + buffer）
      clearTimeout(_scrollHTimer);
      _scrollHTimer = setTimeout(() => { _scrollH = viewport.scrollHeight; }, 350);

      // ── 批次寫入：三份 copy 同步套上 hover 狀態 ──
      clearAll();
      applyToAllCopies(closestIdx, [
        { offset: 0, cls: "is-hover" },
        { offset: -1, cls: "is-neighbor" },
        { offset: 1, cls: "is-neighbor" },
        { offset: -2, cls: "is-neighbor-2" },
        { offset: 2, cls: "is-neighbor-2" },
      ]);

      const centerEl = items[itemsPerCopy + closestIdx];
      if (titleEl) titleEl.textContent = centerEl.dataset.title || "";
      if (subtitleEl) subtitleEl.textContent = centerEl.dataset.subtitle || "";
      floatFilters(centerEl);
    };

    const floatFilters = (el) => {
      if (activeFilter) return;
      const tags = (el.dataset.tags || "").split(" ").filter(Boolean);
      filterBtns.forEach(btn => {
        btn.classList.toggle("is-floating", tags.includes(btn.dataset.filter));
      });
    };

    const clearFloatFilters = () => {
      if (activeFilter) return;
      filterBtns.forEach(btn => btn.classList.remove("is-floating"));
    };

    // 初始化手機中心
    scheduleMobileCenter();

    items.forEach((el, i) => {
      el.addEventListener("mouseenter", () => {
        if (isMobile()) return; // 手機由 updateMobileCenter 控制
        applyHover(i);
        floatFilters(el);
        if (titleEl) titleEl.textContent = el.dataset.title || "";
        if (subtitleEl) subtitleEl.textContent = el.dataset.subtitle || "";
        if (cursorEl) cursorEl.style.opacity = "1";
        if (cursorOutsideEl) cursorOutsideEl.classList.add("is-work");
      });
      el.addEventListener("mouseleave", (e) => {
        if (isMobile()) return;
        if (isCursorSafe(e.relatedTarget)) return;
        if (!activeFilter) clearAll();
        clearFloatFilters();
        if (titleEl) titleEl.textContent = "";
        if (subtitleEl) subtitleEl.textContent = "";
        if (cursorEl) cursorEl.style.opacity = "0";
        if (cursorOutsideEl) cursorOutsideEl.classList.remove("is-work");
      });
    });

    // 移到這些元素時不重置 cursor 狀態
    const isCursorSafe = (el) =>
      el && (
        el.closest(".fx-work-item") ||
        el.closest(".fx-filter-btn") ||
        el.closest("[data-cursor-safe]")
      );

    /* ========= 6) Filter ========= */
    let activeFilter = null;
    const filterBtns = Array.from(document.querySelectorAll(".fx-filter-btn"));

    const clearFilter = () => {
      activeFilter = null;
      lastCenterLocalIdx = -1; // 重置快取，強制重新套用 hover 狀態
      filterBtns.forEach(b => b.classList.remove("is-active"));
      viewport.classList.remove("has-filter");
      items.forEach(el => el.classList.remove("is-active"));
      updateMobileCenter(); // filter 解除後手機重新找中心
    };

    filterBtns.forEach(btn => {
      btn.addEventListener("mouseenter", () => {
        if (cursorOutsideEl) cursorOutsideEl.classList.add("is-filter");
      });
      btn.addEventListener("mouseleave", () => {
        if (cursorOutsideEl) cursorOutsideEl.classList.remove("is-filter");
      });
      btn.addEventListener("click", (e) => {
        e.stopPropagation();
        const tag = btn.dataset.filter;

        // 再次點同一個 filter → 解除
        if (activeFilter === tag) {
          clearFilter();
          return;
        }

        activeFilter = tag;
        if (!isMobile()) clearAll(); // 手機保留現有大小，桌機清除 hover 狀態
        if (isMobile()) filterBtns.forEach(b => b.classList.remove("is-floating")); // 手機：清除 is-floating
        filterBtns.forEach(b => b.classList.toggle("is-active", b.dataset.filter === tag));
        viewport.classList.add("has-filter");

        items.forEach(el => {
          const tags = (el.dataset.tags || "").split(" ");
          el.classList.toggle("is-active", tags.includes(tag));
        });
      });
    });

    // 點空白處解除 filter
    document.addEventListener("click", (e) => {
      if (!activeFilter) return;
      if (e.target.closest("[data-fx-filter-list]") || e.target.closest(".fx-work-item")) return;
      clearFilter();
    });

    // 手機初始化：RAF 跑之前先同步套上 is-hover，避免 layout 膨脹造成位移
    if (_isMobile) {
      items.forEach(el => el.style.transition = 'none');
      applyToAllCopies(0, [
        { offset: 0, cls: "is-hover" },
        { offset: -1, cls: "is-neighbor" },
        { offset: 1, cls: "is-neighbor" },
        { offset: -2, cls: "is-neighbor-2" },
        { offset: 2, cls: "is-neighbor-2" },
      ]);
      lastCenterLocalIdx = 0;
      const centerEl = items[itemsPerCopy]; // copy2 的 item 0
      if (titleEl) titleEl.textContent = centerEl.dataset.title || "";
      if (subtitleEl) subtitleEl.textContent = centerEl.dataset.subtitle || "";
      floatFilters(centerEl);
      // scroll 穩定後才恢復 transition
      requestAnimationFrame(() => requestAnimationFrame(() => {
        items.forEach(el => el.style.transition = '');
      }));
    }
  });

<script>
(function () {
  const toggleBtns = document.querySelectorAll('[tr-color-toggle]');
  const lightLottie = document.querySelector('[data-lottie-theme="light"]');
  const darkLottie = document.querySelector('[data-lottie-theme="dark"]');
  if (!lightLottie || !darkLottie) return;

  const DURATION = 150;
  const BREAKPOINT = 991;

  lightLottie.style.transition = `opacity ${DURATION}ms ease`;
  darkLottie.style.transition = `opacity ${DURATION}ms ease`;

  function isMobile() {
    return window.innerWidth <= BREAKPOINT;
  }

  function fadeOut(el, callback) {
    el.style.opacity = '0';
    setTimeout(() => {
      el.style.display = 'none';
      if (callback) callback();
    }, DURATION);
  }

  function fadeIn(el) {
    el.style.display = 'block';
    void el.offsetWidth;
    el.style.opacity = '1';
  }

  function isDarkMode() {
    const heading = getComputedStyle(document.documentElement)
      .getPropertyValue('--color--heading').trim().toLowerCase();
    return heading === 'white' || heading === '#ffffff';
  }

  function update(animate = true) {
    if (isMobile()) {
      lightLottie.style.display = 'none';
      darkLottie.style.display = 'none';
      return;
    }

    const dark = isDarkMode();

    if (animate) {
      dark ? fadeOut(lightLottie, () => fadeIn(darkLottie))
           : fadeOut(darkLottie, () => fadeIn(lightLottie));
    } else {
      lightLottie.style.display = dark ? 'none' : 'block';
      lightLottie.style.opacity = dark ? '0' : '1';
      darkLottie.style.display = dark ? 'block' : 'none';
      darkLottie.style.opacity = dark ? '1' : '0';
    }
  }

  toggleBtns.forEach(btn => {
    btn.addEventListener('click', () => setTimeout(update, 600));
  });

  window.addEventListener('resize', update);

  // DOMContentLoaded 提早初始化，避免頁面載入時短暫看到兩個 logo
  document.addEventListener('DOMContentLoaded', () => update(false));
})();
</script>





<!-- Page Load Animation -->
<script>
  const transitionTrigger = $(".transition-trigger");
  const introDurationMS = 5000;
  const exitDurationMS = 800;
  const excludedClass = "no-transition";

  const normalizeHost = (host) => host.replace(/^www\./, "");

  window.addEventListener("DOMContentLoaded", () => {
    if (transitionTrigger.length > 0) {
      Webflow.push(() => transitionTrigger.click());

      $("body").addClass("no-scroll-transition");

      setTimeout(() => {
        $("body").removeClass("no-scroll-transition");
        if (typeof lenis !== "undefined") lenis.resize();
      }, introDurationMS);
    }
  });

  $(document).on("click", "a", function (e) {
    const href = $(this).attr("href");

    if (!href || href === "#" || href.startsWith("#")) return;
    if ($(this).hasClass(excludedClass)) return;
    if ($(this).attr("target") === "_blank") return;
    if (transitionTrigger.length === 0) return;

    const url = new URL(href, window.location.href);

    if (normalizeHost(url.hostname) !== normalizeHost(window.location.hostname)) return;

    e.preventDefault();
    e.stopPropagation();

    $("body").addClass("no-scroll-transition");
    transitionTrigger.click();

    setTimeout(() => {
      window.location.href = url.href;
    }, exitDurationMS);
  });

  window.onpageshow = (event) => {
    if (event.persisted) window.location.reload();
  };

  setTimeout(() => {
    $(window).on("resize", () => {
      setTimeout(() => $(".transition").css("display", "none"), 50);
    });
  }, introDurationMS);
</script>

<script>
  const toggle = document.querySelector('[data-menu-toggle="true"]');
  const menuText = toggle.querySelector('.menu-btn_text');

  new MutationObserver(() => {
    const isOpen = toggle.classList.contains('w--open');

    menuText.classList.remove('is-open');
    menuText.classList.add('is-hiding');

    setTimeout(() => {
      menuText.textContent = isOpen ? 'X' : 'Menu';
      menuText.classList.remove('is-hiding');

      if (isOpen) {
        void menuText.offsetWidth;
        menuText.classList.add('is-open');
      }
    }, 200);
  }).observe(toggle, { attributes: true, attributeFilter: ['class'] });
